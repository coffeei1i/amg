<svg xmlns="http://www.w3.org/2000/svg" width="1386" height="279" viewBox="0 0 1386 279">
  <style>
    .title{font:700 15px Arial,sans-serif;fill:#111;text-anchor:middle}
    .body{font:12px Arial,sans-serif;fill:#1f2933;text-anchor:middle}
    .cap{font:10px Arial,sans-serif;fill:#59636e;text-anchor:middle}
    .panel{stroke-width:1.2}
    .arrow{stroke:#59636e;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#59636e"/></marker></defs>
  <rect width="1386" height="279" fill="#fff"/>
  <text x="26" y="142" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle" transform="rotate(-90 26 142)">BRS-Map</text>
  <rect class="panel" x="54" y="44" width="190" height="190" rx="8" fill="#e8f4f0" stroke="#238b77"/>
  <rect class="panel" x="276" y="44" width="190" height="190" rx="8" fill="#eef1f4" stroke="#64727e"/>
  <rect class="panel" x="498" y="44" width="190" height="190" rx="8" fill="#fff4da" stroke="#c18a24"/>
  <rect class="panel" x="720" y="44" width="190" height="190" rx="8" fill="#eaf0fa" stroke="#3567a8"/>
  <rect class="panel" x="942" y="44" width="190" height="190" rx="8" fill="#f5ebf8" stroke="#8e5aa1"/>
  <rect class="panel" x="1164" y="44" width="190" height="190" rx="8" fill="#fbedec" stroke="#c67974"/>
  <path class="arrow" d="M246 139 H273"/><path class="arrow" d="M468 139 H495"/><path class="arrow" d="M690 139 H717"/><path class="arrow" d="M912 139 H939"/><path class="arrow" d="M1134 139 H1161"/>
  <text class="title" x="149" y="25">Source Data</text><text class="body" x="149" y="78"><tspan x="149">Public stimulus-linked</tspan><tspan x="149" dy="17">single-cell datasets</tspan></text><circle cx="125" cy="127" r="5" fill="#238b77"/><circle cx="149" cy="119" r="6" fill="#56a596"/><circle cx="174" cy="130" r="7" fill="#238b77"/><text class="cap" x="149" y="180"><tspan x="149">7 accessions | 16 comparisons</tspan><tspan x="149" dy="15">861,176 external cells</tspan></text>
  <text class="title" x="371" y="25">Identity Mapping</text><text class="body" x="371" y="78"><tspan x="371">Anchor-based 41-type</tspan><tspan x="371" dy="17">cell identity</tspan></text><circle cx="339" cy="126" r="6" fill="#238b77"/><circle cx="356" cy="114" r="5" fill="#56a596"/><line x1="370" y1="121" x2="391" y2="121" stroke="#59636e" stroke-width="2"/><circle cx="407" cy="114" r="5" fill="#64727e"/><circle cx="423" cy="128" r="6" fill="#94a0a8"/><text class="cap" x="371" y="174"><tspan x="371">primary ≥0.50 | sensitivity 0.30–&lt;0.50</tspan><tspan x="371" dy="15">feature coverage ≥0.70</tspan></text>
  <text class="title" x="593" y="25">Score Construction</text><text class="body" x="593" y="78"><tspan x="593">Cell-type-specific</tspan><tspan x="593" dy="17">signed response programs</tspan></text><text x="565" y="139" font-family="Arial" font-size="27" fill="#c67974">↑</text><text x="608" y="139" font-family="Arial" font-size="27" fill="#3567a8">↓</text><text class="cap" x="593" y="174"><tspan x="593">formal signature or fallback</tspan><tspan x="593" dy="15">UCell up − down | maxRank 1,500</tspan></text>
  <text class="title" x="815" y="25">Round 1 Transfer</text><text class="body" x="815" y="78"><tspan x="815">External-cell scores →</tspan><tspan x="815" dy="17">snRNA reference</tspan></text><circle cx="780" cy="127" r="5" fill="#238b77"/><circle cx="800" cy="117" r="6" fill="#56a596"/><line x1="812" y1="123" x2="833" y2="123" stroke="#59636e" stroke-width="2"/><circle cx="848" cy="115" r="6" fill="#3567a8"/><text class="cap" x="815" y="174"><tspan x="815">exact Celltype | PCs 1–30 | k=20</tspan><tspan x="815" dy="15">source ≥100 | unit-balanced</tspan></text>
  <text class="title" x="1037" y="25">Round 2 Transfer</text><text class="body" x="1037" y="78"><tspan x="1037">snRNA reference →</tspan><tspan x="1037" dy="17">Stereo-seq CellBins</tspan></text><circle cx="1000" cy="122" r="6" fill="#3567a8"/><line x1="1014" y1="122" x2="1033" y2="122" stroke="#59636e" stroke-width="2"/><path d="M1045 138 Q1060 95 1085 135 Q1102 100 1113 139" fill="none" stroke="#8e5aa1" stroke-width="1.5"/><text class="cap" x="1037" y="174"><tspan x="1037">exact Celltype | PCs 1–30 | k=20</tspan><tspan x="1037" dy="15">source ≥100 | same weighting</tspan></text>
  <text class="title" x="1259" y="25">Spatial Readout</text><text class="body" x="1259" y="78"><tspan x="1259">Inferred spatial</tspan><tspan x="1259" dy="17">response maps</tspan></text><path d="M1195 143 Q1210 98 1230 139" fill="none" stroke="#c67974" stroke-width="1.5"/><path d="M1240 143 Q1258 101 1277 140" fill="none" stroke="#c67974" stroke-width="1.5"/><path d="M1287 143 Q1305 102 1325 140" fill="none" stroke="#c67974" stroke-width="1.5"/><circle cx="1211" cy="124" r="3" fill="#c43b32"/><circle cx="1259" cy="126" r="3" fill="#3567a8"/><circle cx="1307" cy="124" r="3" fill="#c43b32"/><text class="cap" x="1259" y="174"><tspan x="1259">three Stereo-seq sections</tspan><tspan x="1259" dy="15">CellBin score | AP order unresolved</tspan></text>
</svg>
