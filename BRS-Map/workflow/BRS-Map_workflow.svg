<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="560" viewBox="0 0 1800 560" role="img" aria-labelledby="title desc">
  <title id="title">BRS-Map final workflow</title>
  <desc id="desc">Evidence-aware construction and two-stage transfer of behavioral response scores.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59636E"/></marker>
    <style>
      .title{font:700 26px Arial,sans-serif;fill:#17212B}.subtitle{font:14px Arial,sans-serif;fill:#59636E}
      .head{font:700 16px Arial,sans-serif;fill:#17212B}.body{font:13px Arial,sans-serif;fill:#303B44}.small{font:12px Arial,sans-serif;fill:#4E5A64}
      .card{stroke-width:2}.arrow{stroke:#59636E;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="560" fill="#FFFFFF"/>
  <text x="40" y="49" class="title">BRS-Map: evidence-aware behavioral-response score mapping</text>
  <text x="42" y="78" class="subtitle">Cell-type-resolved programs &#8594; snRNA reference &#8594; Stereo-seq CellBins</text>

  <g id="inputs"><rect class="card" x="40" y="115" width="185" height="270" rx="12" fill="#EEF4F3" stroke="#476A75"/><text text-anchor="middle" x="132.5" y="148" class="head">1  Harmonized inputs</text><text text-anchor="middle" x="132.5" y="188" class="body"><tspan x="132.5">7 retained datasets</tspan><tspan x="132.5" dy="24">48 post-QC objects</tspan><tspan x="132.5" dy="24">16 prespecified contrasts</tspan></text><text text-anchor="middle" x="132.5" y="302" class="small"><tspan x="132.5">Raw counts + condition +</tspan><tspan x="132.5" dy="20">experimental_unit_id</tspan></text></g>
  <g id="identity"><rect class="card" x="245" y="115" width="205" height="270" rx="12" fill="#EEF4F3" stroke="#476A75"/><text text-anchor="middle" x="347.5" y="148" class="head">2  Identity mapping</text><text text-anchor="middle" x="347.5" y="188" class="body"><tspan x="347.5">One anchor set</tspan><tspan x="347.5" dy="24">One 49-type transfer</tspan><tspan x="347.5" dy="24">One UMAP projection</tspan></text><text text-anchor="middle" x="347.5" y="292" class="small"><tspan x="347.5">primary &#8805; 0.50</tspan><tspan x="347.5" dy="20">sensitivity 0.30&#8211;&lt;0.50</tspan><tspan x="347.5" dy="20">feature coverage &#8805; 0.70</tspan></text></g>
  <g id="evidence"><rect class="card" x="470" y="115" width="250" height="270" rx="12" fill="#FFF3DC" stroke="#A66B1E"/><text text-anchor="middle" x="595" y="148" class="head">3  Evidence + program</text><text x="490" y="188" class="body"><tspan font-weight="700">Sample: </tspan><tspan>formal / low-power / descriptive</tspan><tspan x="490" dy="28" font-weight="700">Genes: </tspan><tspan>FDR signature / top-20 fallback (*)</tspan><tspan x="490" dy="28" font-weight="700">Identity: </tspan><tspan>primary / sensitivity (S)</tspan></text><text text-anchor="middle" x="595" y="300" class="small"><tspan x="595">Pseudobulk by independent unit</tspan><tspan x="595" dy="19">&#215; exact Celltype</tspan><tspan x="595" dy="19">&#8805;20 cells per retained unit</tspan></text></g>
  <g id="ucell"><rect class="card" x="740" y="115" width="175" height="270" rx="12" fill="#FFF3DC" stroke="#A66B1E"/><text text-anchor="middle" x="827.5" y="148" class="head">4  Signed score</text><text text-anchor="middle" x="827.5" y="194" class="body"><tspan x="827.5">UCell up program</tspan><tspan x="827.5" dy="24">minus</tspan><tspan x="827.5" dy="24">UCell down program</tspan></text><text text-anchor="middle" x="827.5" y="292" class="small"><tspan x="827.5">maxRank = 1,500</tspan><tspan x="827.5" dy="20">&#8805;10 mapped genes</tspan><tspan x="827.5" dy="20">per direction</tspan></text></g>
  <g id="round1"><rect class="card" x="935" y="115" width="180" height="270" rx="12" fill="#EDF2FA" stroke="#476FA8"/><text text-anchor="middle" x="1025" y="148" class="head">5  Round 1</text><text text-anchor="middle" x="1025" y="190" class="body">External cells &#8594; snRNA</text><text text-anchor="middle" x="1025" y="238" class="small"><tspan x="1025">Exact Celltype</tspan><tspan x="1025" dy="20">PCs 1&#8211;30; k = 20</tspan><tspan x="1025" dy="20">source &#8805; 100 cells</tspan><tspan x="1025" dy="20">unit-balanced</tspan><tspan x="1025" dy="20">weighted-kNN</tspan></text></g>
  <g id="round2"><rect class="card" x="1135" y="115" width="180" height="270" rx="12" fill="#EDF2FA" stroke="#476FA8"/><text text-anchor="middle" x="1225" y="148" class="head">6  Round 2</text><text text-anchor="middle" x="1225" y="190" class="body">snRNA &#8594; Stereo-seq</text><text text-anchor="middle" x="1225" y="238" class="small"><tspan x="1225">Exact Celltype</tspan><tspan x="1225" dy="20">PCs 1&#8211;30; k = 20</tspan><tspan x="1225" dy="20">reference &#8805; 100 cells</tspan><tspan x="1225" dy="20">same weighted-kNN</tspan><tspan x="1225" dy="20">CellBin output</tspan></text></g>
  <g id="direction"><rect class="card" x="1335" y="115" width="200" height="270" rx="12" fill="#FBEDEC" stroke="#B35A52"/><text text-anchor="middle" x="1435" y="148" class="head">7  Final audit</text><text text-anchor="middle" x="1435" y="188" class="body"><tspan x="1435">Keep only same-sign</tspan><tspan x="1435" dy="24">Round 1 and Round 2</tspan></text><text text-anchor="middle" x="1435" y="266" class="small"><tspan x="1435">Reversal / zero / failure &#8594; NA</tspan><tspan x="1435" dy="20">primary-first; sensitivity</tspan><tspan x="1435" dy="20">fills only missing primary</tspan><tspan x="1435" dy="20">markers: S, *, S*</tspan></text></g>
  <g id="readouts"><rect class="card" x="1555" y="115" width="205" height="270" rx="12" fill="#EDF6EA" stroke="#4C7A52"/><text text-anchor="middle" x="1657.5" y="148" class="head">8  Final readouts</text><text text-anchor="middle" x="1657.5" y="176" class="small">41 neuronal types only</text><text text-anchor="middle" x="1657.5" y="204" class="body"><tspan x="1657.5" font-weight="700">Celltype landscape</tspan><tspan x="1657.5" dy="19">scale cells, then mean</tspan><tspan x="1657.5" dy="28" font-weight="700">Spatial programs</tspan><tspan x="1657.5" dy="19">joint M1&#8211;M3 Q95 scaling</tspan><tspan x="1657.5" dy="28" font-weight="700">Subnuclei</tspan><tspan x="1657.5" dy="19">pooled directional balance</tspan></text></g>

  <path class="arrow" d="M225 250 H245"/><path class="arrow" d="M450 250 H470"/><path class="arrow" d="M720 250 H740"/><path class="arrow" d="M915 250 H935"/><path class="arrow" d="M1115 250 H1135"/><path class="arrow" d="M1315 250 H1335"/><path class="arrow" d="M1535 250 H1555"/>
  <text text-anchor="middle" x="900" y="444" class="subtitle" font-style="italic">All thresholds and NA reasons are exported in audit tables. Stereo AP order: UNRESOLVED_DO_NOT_GUESS.</text>
  <rect x="300" y="470" width="1200" height="50" rx="9" fill="#F7F9FA" stroke="#B8C1C8"/>
  <text text-anchor="middle" x="900" y="501" class="body">Spatial scaling: clip(raw / Q0.95(|raw across M1&#8211;M3|), &#8722;1, 1)   |   Subnuclear balance: (positive &#8722; negative) / (positive + negative)</text>
</svg>
